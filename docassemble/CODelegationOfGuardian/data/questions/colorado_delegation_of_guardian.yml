id: Colorado Delegation of Guardian intro
continue button field: colorado_delegation_of_guardian_intro
question: |
  Colorado Delegation of Guardian
subquestion: |
  ### Before you get started
  - Gather the full names and dates of birth of the child or incapacitated person.
  - Identify the individual you wish to appoint as Attorney in Fact.

  ### When you are finished
  - Ensure the form is signed and dated by you and notarized. Keep a copy for your records.

  You can use this form if you're a parent or guardian wanting to delegate your responsibilities temporarily. It's important to specify the duration and the powers you are granting.
