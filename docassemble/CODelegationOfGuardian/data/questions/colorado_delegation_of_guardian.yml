metadata:
  title: >-
    Colorado Delegation of Guardian
  short title: >-
    Colorado Delegation of Gu
  description: |-
    This form allows a parent or guardian to delegate their authority over a minor or incapacitated person to another individual. It covers day-to-day care and medical decisions, ensuring that the appointed person can act on behalf of the child or incapacitated individual.
  can_I_use_this_form: |
    You can use this form if you're a parent or guardian wanting to delegate your responsibilities temporarily. It's important to specify the duration and the powers you are granting.
  before_you_start: |
    ### Before you get started
    - Gather the full names and dates of birth of the child or incapacitated person.
    - Identify the individual you wish to appoint as Attorney in Fact.

    ### When you are finished
    - Ensure the form is signed and dated by you and notarized. Keep a copy for your records.
  when_you_are_finished: |
    After completing the form, make sure to provide a copy to the appointed Attorney in Fact. You may also want to inform any relevant parties, such as schools or medical providers, about the delegation.
